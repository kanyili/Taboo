<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>說出關鍵字 Keyword</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }
        body {
            margin: 0;
            padding: 15px;
            /* 溫馨深色手作紙板背景 */
            background-color: #2b2623;
            color: #f4eee2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* 確保整個遊戲畫面沒有 scroll bar */
            transition: background-color 0.2s ease;
        }
        .container {
            width: 100%;
            max-width: 500px;
            /* 手帳紙板容器 */
            background: #38312c;
            padding: 24px;
            border-radius: 12px;
            border: 2px dashed #6b5b52;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            text-align: center;
            max-height: 95vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: #ff8c42;
            letter-spacing: 1px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            background: #2b2623;
            border: 2px solid #5c4d44;
            color: #f4eee2;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: center;
        }
        input[type="text"]:focus {
            border-color: #ff8c42;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #e06d53;
            color: white;
            border: 2px solid #f4eee2;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 0 #9c432d;
            transition: all 0.1s;
        }
        button:hover {
            background: #f07b5f;
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #9c432d;
        }
        button:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #9c432d;
        }
        .tag-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            justify-content: center;
            max-height: 120px;
            overflow-y: auto;
        }
        .tag {
            /* 紙膠帶風格標籤 */
            background: #e6c594;
            color: #2b2623;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
            transform: rotate(-1deg);
        }
        .tag:nth-child(even) {
            transform: rotate(1deg);
            background: #c3d69b;
        }
        .tag span {
            cursor: pointer;
            color: #b83b27;
            font-size: 16px;
        }
        .status-box {
            font-size: 15px;
            margin: 12px 0;
            color: #d4c5b9;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2b2623;
            border: 2px solid #5c4d44;
            padding: 10px 14px;
            border-radius: 8px;
        }
        /* 語音偵測詞句顯示框：字太多時自動顯示 scroll bar */
        .subtitle-box {
            background: #2b2623;
            border-radius: 8px;
            padding: 15px;
            height: 180px; 
            overflow-y: auto; /* 當字太多時顯示捲軸 */
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            margin-bottom: 15px;
            border: 2px dashed #5c4d44;
            text-align: center;
        }
        .interim-text {
            font-size: 16px;
            color: #a3968c;
            font-style: italic;
            word-break: break-all;
        }
        .final-text {
            font-size: 20px;
            color: #f4eee2;
            margin-top: 8px;
            word-break: break-all;
        }
        /* 閃爍警報特效 */
        @keyframes flash-screen {
            0% { background-color: #b83b27; }
            50% { background-color: #2b2623; }
            100% { background-color: #b83b27; }
        }
        body.flash {
            animation: flash-screen 0.2s infinite;
        }
        /* 關鍵字高亮閃爍 */
        @keyframes blink-word {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }
        .highlight-forbidden {
            color: #ff8c42 !important;
            font-weight: bold;
            font-size: 1.2em;
            display: inline-block;
            animation: blink-word 0.3s infinite;
            background: rgba(255, 140, 66, 0.25);
            padding: 0 4px;
            border-radius: 4px;
            border: 1px dotted #ff8c42;
        }
        .alert-banner {
            font-size: 20px;
            font-weight: bold;
            color: #ff8c42;
            margin-bottom: 12px;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .secondary-btn {
            background: #5c4d44;
            box-shadow: 0 4px 0 #38312c;
        }
        .secondary-btn:hover {
            background: #6e5d53;
            box-shadow: 0 6px 0 #38312c;
        }
        .secondary-btn:active {
            box-shadow: 0 2px 0 #38312c;
        }
        .peek-btn {
            background: #4682b4;
            box-shadow: 0 3px 0 #2c5270;
            padding: 5px 12px;
            font-size: 13px;
            width: auto;
            border-radius: 6px;
        }
        .peek-btn:hover {
            background: #5a9bd4;
            box-shadow: 0 4px 0 #2c5270;
        }

        /* 偷看關鍵字彈窗 */
        #peekModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(43, 38, 35, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-content {
            background: #38312c;
            border: 2px solid #ff8c42;
            padding: 24px;
            border-radius: 12px;
            min-width: 280px;
            max-width: 90%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .modal-title {
            font-size: 15px;
            color: #d4c5b9;
            margin-bottom: 12px;
        }
        .modal-words-list {
            font-size: 22px;
            color: #ff8c42;
            font-weight: bold;
            line-height: 1.6;
        }

        /* 遊戲結束/違規中央彈窗 */
        #gameOverModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(43, 38, 35, 0.85);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9998;
            padding: 15px;
        }
        .game-over-content {
            background: #38312c;
            border: 2px solid #e06d53;
            padding: 24px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        /* 強制直向警告遮罩 */
        #landscapeWarning {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #2b2623;
            color: #f4eee2;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            padding: 20px;
        }
        @media screen and (orientation: landscape) {
            #landscapeWarning {
                display: flex;
            }
        }
    </style>
</head>
<body>

    <!-- 強制直向提示畫面 -->
    <div id="landscapeWarning">
        📱 請將手機轉回直向<br>
        <span style="font-size: 14px; color: #a3968c; margin-top: 10px; font-weight: normal;">遊戲只支援直向畫面</span>
    </div>

    <!-- 偷看關鍵字彈窗 -->
    <div id="peekModal">
        <div class="modal-content">
            <div class="modal-title">目前設定的關鍵字</div>
            <div class="modal-words-list" id="modalWordsList"></div>
        </div>
    </div>

    <!-- 遊戲結束/違規中央彈窗 -->
    <div id="gameOverModal">
        <div class="game-over-content">
            <div id="alertBanner" class="alert-banner">有人講出關鍵字了！</div>
            <div class="subtitle-box" style="margin-bottom: 15px; height: 90px; padding: 10px;">
                <div class="final-text" id="modalFinalText" style="margin-top:0; font-size: 18px;"></div>
            </div>
            <div class="action-buttons">
                <button class="secondary-btn" id="modalLeftBtn" onclick="returnToSetup()">結束遊戲</button>
                <button id="modalRightBtn" onclick="resetGame()">重來</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- 準備畫面 -->
        <div id="setupScreen" class="screen active">
            <h1>關鍵字 Keyword</h1>
            <p style="color: #a3968c; font-size: 13px; margin-bottom: 15px;">輸入「關鍵字」</p>
            
            <input type="text" id="wordInput" placeholder="(例如: 謝謝)">
            <button onclick="addForbiddenWord()">新增關鍵字</button>

            <div class="tag-list" id="tagList" style="margin-top: 15px;"></div>

            <button id="startBtn" onclick="startGame()" style="margin-top: 15px; background: #6b9071; border-color: #f4eee2; box-shadow: 0 4px 0 #425c46; display: none;">開始遊戲</button>
        </div>

        <!-- 遊戲進行畫面 -->
        <div id="gameScreen" class="screen">
            <h1>遊戲進行中</h1>
            
            <div class="status-box">
                <div>時間: <span id="timerDisplay">0分0秒</span></div>
                <button class="peek-btn" id="peekBtn" onclick="peekWords()">偷看關鍵字</button>
            </div>

            <div class="subtitle-box" id="gameSubtitleBox">
                <div class="interim-text" id="interimText">（請說話，我有在聽...）</div>
                <div class="final-text" id="finalText"></div>
            </div>

            <div class="action-buttons">
                <button class="secondary-btn" onclick="manualEndGame()">結束遊戲</button>
            </div>
        </div>
    </div>

    <script>
        let forbiddenWords = [];
        let recognition = null;
        let isGameOver = false;
        let audioCtx = null;
        let timerInterval = null;
        let secondsElapsed = 0;

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("您的瀏覽器不支援語音辨識 API，建議在 iPhone 上使用 Safari，或在電腦/Android 上使用 Chrome！");
        }

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playAlarmSound() {
            try {
                initAudio();
                if (!audioCtx) return;

                let now = audioCtx.currentTime;
                for (let i = 0; i < 3; i++) {
                    let osc = audioCtx.createOscillator();
                    let gainNode = audioCtx.createGain();

                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(880, now + (i * 0.25));

                    gainNode.gain.setValueAtTime(0.3, now + (i * 0.25));
                    gainNode.gain.exponentialRampToValueAtTime(0.01, now + (i * 0.25) + 0.2);

                    osc.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    osc.start(now + (i * 0.25));
                    osc.stop(now + (i * 0.25) + 0.2);
                }
            } catch (e) {
                console.log("音效播放失敗: ", e);
            }
        }

        function addForbiddenWord() {
            const input = document.getElementById('wordInput');
            const word = input.value.trim();
            if (word && !forbiddenWords.includes(word)) {
                forbiddenWords.push(word);
                input.value = '';
                renderTags();
                toggleStartButton();
            }
        }

        function removeWord(index) {
            forbiddenWords.splice(index, 1);
            renderTags();
            toggleStartButton();
        }

        function renderTags() {
            const tagList = document.getElementById('tagList');
            tagList.innerHTML = '';
            forbiddenWords.forEach((word, index) => {
                const tag = document.createElement('div');
                tag.className = 'tag';
                tag.innerHTML = `${word} <span onclick="removeWord(${index})">&times;</span>`;
                tagList.appendChild(tag);
            });
        }

        function toggleStartButton() {
            const startBtn = document.getElementById('startBtn');
            startBtn.style.display = forbiddenWords.length > 0 ? 'block' : 'none';
        }

        function startGame() {
            initAudio();
            document.getElementById('setupScreen').classList.remove('active');
            document.getElementById('gameScreen').classList.add('active');
            document.getElementById('gameOverModal').style.display = 'none';
            
            isGameOver = false;
            secondsElapsed = 0;
            document.getElementById('timerDisplay').innerText = '0分0秒';
            document.getElementById('finalText').innerText = '';
            document.getElementById('interimText').innerText = '（請說話，我有在聽...）';

            startTimer();
            initSpeechRecognition();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (isGameOver) return;
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60);
                const secs = secondsElapsed % 60;
                document.getElementById('timerDisplay').innerText = `${mins}分${secs}秒`;
            }, 1000);
        }

        function peekWords() {
            const modal = document.getElementById('peekModal');
            const listContainer = document.getElementById('modalWordsList');
            const peekBtn = document.getElementById('peekBtn');
            
            listContainer.innerHTML = forbiddenWords.join('<br>');
            modal.style.display = 'flex';
            peekBtn.disabled = true;

            setTimeout(() => {
                modal.style.display = 'none';
                peekBtn.disabled = false;
            }, 1000);
        }

        function initSpeechRecognition() {
            if (!SpeechRecognition) return;

            recognition = new SpeechRecognition();
            recognition.lang = 'zh-TW';
            recognition.interimResults = true;
            recognition.continuous = true;

            let accumulatedText = "";

            recognition.onresult = function(event) {
                if (isGameOver) return;

                let interim = '';
                let final = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        final += event.results[i][0].transcript;
                    } else {
                        interim += event.results[i][0].transcript;
                    }
                }

                if (final) {
                    accumulatedText += (accumulatedText ? " " : "") + final;
                    document.getElementById('finalText').innerText = accumulatedText;
                    document.getElementById('interimText').innerText = '';
                    
                    // 自動滾動到底部
                    const box = document.getElementById('gameSubtitleBox');
                    box.scrollTop = box.scrollHeight;

                    checkForbidden(final);
                } else if (interim) {
                    document.getElementById('interimText').innerText = interim;
                }
            };

            recognition.onerror = function(event) {
                console.log("語音辨識錯誤: ", event.error);
            };

            recognition.onend = function() {
                if (!isGameOver) {
                    try {
                        recognition.start();
                    } catch (e) {
                        console.log("重新啟動麥克風");
                    }
                }
            };

            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }

        function checkForbidden(text) {
            let triggeredWord = null;

            for (let word of forbiddenWords) {
                if (text.includes(word)) {
                    triggeredWord = word;
                    break;
                }
            }

            if (triggeredWord) {
                triggerGameOver(`💥 發現關鍵字「${triggeredWord}」`, document.getElementById('finalText').innerText, triggeredWord);
            }
        }

        function manualEndGame() {
            isGameOver = true;
            clearInterval(timerInterval);
            if (recognition) {
                recognition.stop();
            }

            const alertBanner = document.getElementById('alertBanner');
            alertBanner.innerText = "結束遊戲";

            const textContent = document.getElementById('finalText').innerText;
            document.getElementById('modalFinalText').innerText = textContent ? textContent : '（尚未偵測到語音）';

            const leftBtn = document.getElementById('modalLeftBtn');
            const rightBtn = document.getElementById('modalRightBtn');

            leftBtn.innerText = "回到遊戲";
            leftBtn.className = ""; 
            leftBtn.onclick = resumeGame; 

            rightBtn.innerText = "結束遊戲";
            rightBtn.className = "secondary-btn"; 
            rightBtn.onclick = returnToSetup; 

            document.getElementById('gameOverModal').style.display = 'flex';
        }

        function resumeGame() {
            document.getElementById('gameOverModal').style.display = 'none';
            isGameOver = false;
            startTimer();
            initSpeechRecognition();
        }

        function returnToSetup() {
            isGameOver = true;
            clearInterval(timerInterval);
            if (recognition) {
                recognition.stop();
            }

            forbiddenWords = [];
            renderTags();
            toggleStartButton();

            document.body.classList.remove('flash');
            document.getElementById('gameOverModal').style.display = 'none';

            document.getElementById('gameScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
        }

        function triggerGameOver(bannerText, textContent, triggeredWord) {
            isGameOver = true;
            clearInterval(timerInterval);
            if (recognition) {
                recognition.stop();
            }

            const alertBanner = document.getElementById('alertBanner');
            alertBanner.innerText = bannerText;

            const leftBtn = document.getElementById('modalLeftBtn');
            const rightBtn = document.getElementById('modalRightBtn');

            leftBtn.innerText = "結束遊戲";
            leftBtn.className = "secondary-btn";
            leftBtn.onclick = returnToSetup;

            rightBtn.innerText = "重來";
            rightBtn.className = "";
            rightBtn.onclick = resetGame;
            
            if (triggeredWord) {
                playAlarmSound();
                document.body.classList.add('flash');
            }

            if (textContent) {
                if (triggeredWord) {
                    const highlightedText = textContent.replace(new RegExp(triggeredWord, 'g'), `<span class="highlight-forbidden">${triggeredWord}</span>`);
                    document.getElementById('modalFinalText').innerHTML = highlightedText;
                } else {
                    document.getElementById('modalFinalText').innerText = textContent;
                }
            } else {
                document.getElementById('modalFinalText').innerText = '（尚未偵測到語音）';
            }

            document.getElementById('gameOverModal').style.display = 'flex';
        }

        function resetGame() {
            document.body.classList.remove('flash');
            document.getElementById('gameOverModal').style.display = 'none';
            startGame(); 
        }
    </script>
</body>
</html>
